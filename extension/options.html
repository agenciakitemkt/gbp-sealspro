<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SealsPro Pré Análise: opções</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; user-select: all; }
    input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    button { margin-top: 8px; padding: 6px 14px; font: inherit; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>SealsPro Pré Análise</h1>
  <p>ID desta extensão (copie para o app com <code>coletar.py id-extensao &lt;ID&gt;</code>):<br><code id="ext-id"></code></p>
  <label for="secret">Segredo (gerado por <code>coletar.py segredo-extensao</code>):</label>
  <input id="secret" type="password" autocomplete="off" spellcheck="false">
  <button id="save" type="button">Salvar</button>
  <button id="test" type="button">Testar conexão com o app</button>
  <p id="status" role="status"></p>
  <script src="src/options.js"></script>
</body>
</html>
